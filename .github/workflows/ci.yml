name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            download-buffer-size = 536870912

      - name: Eval default.nix
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          nix-instantiate --strict --eval --json -E '
            let
              pkgs = import <nixpkgs> {
                config.allowUnfree = true;
                config.nvidia.acceptLicense = true;
              };
              drivers = pkgs.callPackage ./. {
                kernel = pkgs.linuxPackages.kernel;
                kernelModuleMakeFlags = pkgs.linuxPackages.kernelModuleMakeFlags;
              };
            in {
              production = drivers.production.version;
              new_feature = drivers.new_feature.version;
              beta = drivers.beta.version;
              latest = drivers.latest.version;
              bleeding_edge = drivers.bleeding_edge.version;
            }
          '

      - name: Build open kernel module for each branch against linuxPackages.kernel
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          # latest and bleeding_edge are aliases of one of the three
          # concrete branches; the eval step already verifies they
          # resolve, so building them here would be redundant.
          for branch in production new_feature beta; do
            echo "::group::Build $branch.open"
            nix-build --no-out-link -E "
              let
                pkgs = import <nixpkgs> {
                  config.allowUnfree = true;
                  config.nvidia.acceptLicense = true;
                };
                drivers = pkgs.callPackage ./. {
                  kernel = pkgs.linuxPackages.kernel;
                  kernelModuleMakeFlags = pkgs.linuxPackages.kernelModuleMakeFlags;
                };
              in drivers.$branch.open
            "
            echo "::endgroup::"
          done

      - name: Build closed driver for each branch against linuxPackages.kernel
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          # Even when consumers use `hardware.nvidia.open = true`, the
          # userspace libraries (libGL, libGLX_nvidia, etc.) still come
          # from this closed driver derivation, so it needs to build
          # cleanly for the package to be usable at all.
          for branch in production new_feature beta; do
            echo "::group::Build $branch (closed)"
            nix-build --no-out-link -E "
              let
                pkgs = import <nixpkgs> {
                  config.allowUnfree = true;
                  config.nvidia.acceptLicense = true;
                };
                drivers = pkgs.callPackage ./. {
                  kernel = pkgs.linuxPackages.kernel;
                  kernelModuleMakeFlags = pkgs.linuxPackages.kernelModuleMakeFlags;
                };
              in drivers.$branch
            "
            echo "::endgroup::"
          done
