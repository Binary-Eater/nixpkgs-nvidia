name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Eval default.nix
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          nix-instantiate --strict --eval --json -E '
            let
              pkgs = import <nixpkgs> {
                config.allowUnfree = true;
                config.nvidia.acceptLicense = true;
              };
              drivers = pkgs.callPackage ./. {
                kernel = pkgs.linuxPackages.kernel;
              };
            in {
              production = drivers.production.version;
              new_feature = drivers.new_feature.version;
              beta = drivers.beta.version;
              latest = drivers.latest.version;
              bleeding_edge = drivers.bleeding_edge.version;
            }
          '

      - name: Build production, new_feature, and beta against linuxPackages.kernel
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          # latest and bleeding_edge are aliases of one of these three
          # concrete branches, so building them would be redundant; the
          # eval step above already verifies they resolve.
          for branch in production new_feature beta; do
            echo "::group::Build $branch"
            nix-build --no-out-link -E "
              let
                pkgs = import <nixpkgs> {
                  config.allowUnfree = true;
                  config.nvidia.acceptLicense = true;
                };
                drivers = pkgs.callPackage ./. {
                  kernel = pkgs.linuxPackages.kernel;
                };
              in drivers.$branch
            "
            echo "::endgroup::"
          done
