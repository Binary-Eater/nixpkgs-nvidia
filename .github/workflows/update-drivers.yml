name: Update NVIDIA drivers

on:
  schedule:
    # Daily at 06:00 UTC. NVIDIA usually publishes mid-week US business hours,
    # so 06:00 UTC catches updates by the next morning regardless of time zone.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            download-buffer-size = 536870912

      - name: Scrape NVIDIA Unix drivers page and rewrite default.nix
        id: update
        run: python3 .github/scripts/update-drivers.py

      - name: Evaluate updated default.nix
        if: steps.update.outputs.changed == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          nix-instantiate --strict --eval --json -E '
            let
              pkgs = import <nixpkgs> {
                config.allowUnfree = true;
                config.nvidia.acceptLicense = true;
              };
              drivers = pkgs.callPackage ./. {
                kernel = pkgs.linuxPackages.kernel;
                kernelModuleMakeFlags = pkgs.linuxPackages.kernelModuleMakeFlags;
              };
            in {
              production = drivers.production.version;
              new_feature = drivers.new_feature.version;
              beta = drivers.beta.version;
              latest = drivers.latest.version;
              bleeding_edge = drivers.bleeding_edge.version;
            }
          '

      - name: Build open kernel module for each updated branch
        if: steps.update.outputs.changed == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          updated='${{ steps.update.outputs.updated }}'
          branches=$(echo "$updated" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin).keys()))')
          for branch in $branches; do
            echo "::group::Build $branch.open"
            nix-build --no-out-link -E "
              let
                pkgs = import <nixpkgs> {
                  config.allowUnfree = true;
                  config.nvidia.acceptLicense = true;
                };
                drivers = pkgs.callPackage ./. {
                  kernel = pkgs.linuxPackages.kernel;
                  kernelModuleMakeFlags = pkgs.linuxPackages.kernelModuleMakeFlags;
                };
              in drivers.$branch.open
            "
            echo "::endgroup::"
          done

      - name: Build closed driver for each updated branch
        if: steps.update.outputs.changed == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          # Userspace libraries come from this derivation even when the
          # consumer is on the open kernel module, so it needs to build.
          updated='${{ steps.update.outputs.updated }}'
          branches=$(echo "$updated" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin).keys()))')
          for branch in $branches; do
            echo "::group::Build $branch (closed)"
            nix-build --no-out-link -E "
              let
                pkgs = import <nixpkgs> {
                  config.allowUnfree = true;
                  config.nvidia.acceptLicense = true;
                };
                drivers = pkgs.callPackage ./. {
                  kernel = pkgs.linuxPackages.kernel;
                  kernelModuleMakeFlags = pkgs.linuxPackages.kernelModuleMakeFlags;
                };
              in drivers.$branch
            "
            echo "::endgroup::"
          done

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            default.nix: bump NVIDIA driver versions

            ${{ steps.update.outputs.summary }}
          title: 'default.nix: bump NVIDIA driver versions (${{ steps.update.outputs.summary }})'
          body: |
            Automated update from <https://www.nvidia.com/en-us/drivers/unix/>.

            Updated branches: `${{ steps.update.outputs.summary }}`

            Validation that ran in this workflow:
            - `nix-instantiate --eval` against `<nixpkgs>` with `linuxPackages.kernel`
            - `nix-build` of each updated branch against `linuxPackages.kernel`
              (fetches the new runfile, verifies its SRI hash, runs `builder.sh`,
              and compiles the kernel module)
          branch: automated/update-nvidia-drivers
          base: trunk
          delete-branch: true
          add-paths: default.nix
